name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.1
      - name: Check Python style
        run: ruff check .
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover tests
      - name: Compile bundled scripts
        run: python -m compileall -q scripts bin/hcloud-skill
      - name: Smoke portable entrypoint outside the checkout
        run: |
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/bin/hcloud-skill" hcloud_environment_doctor --help >/dev/null
      - name: Check whitespace
        run: git diff --check
